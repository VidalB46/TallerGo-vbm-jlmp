<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TallerGO — Historial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <th:block th:replace="~{fragments/navbar :: navbarCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/views.css}"/>
</head>

<body class="appointments-page">

<nav th:replace="~{fragments/navbar :: navbar('appointments')}"></nav>

<div class="page-hero" style="background: linear-gradient(135deg, #1f2937 0%, #111827 100%);">
    <div class="page-hero-inner" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1.5rem;">
        <div class="page-hero-text">
            <div class="page-label" style="color: #9ca3af;" th:text="#{msg.appointment-history.label}">Archivo</div>
            <h1 th:text="#{msg.appointment-history.title}">Historial Completo</h1>
            <p th:text="#{msg.appointment-history.subtitle}">Registro de todas las citas, intervenciones y cancelaciones.</p>
        </div>
        <a th:href="@{/appointments}" class="btn-modern btn-outline" style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
            <i class="bi bi-arrow-left"></i> <span th:text="#{msg.appointment-history.back}">Volver a citas activas</span>
        </a>
    </div>
</div>

<main class="appt-main">

    <div class="appt-grid">

        <div class="appt-empty" th:if="${appointmentsPage != null and appointmentsPage.empty}">
            <i class="bi bi-clock-history"></i>
            <p th:text="#{msg.appointment-history.empty}">No tienes citas en tu historial.</p>
        </div>

        <div class="appt-card"
             th:each="appt, stat : ${appointmentsPage.content}"
             th:style="'animation-delay:' + ${stat.index * 70} + 'ms; filter: grayscale(20%); opacity: 0.9;'">

            <div class="appt-card-stripe"
                 th:classappend="${#strings.toString(appt.status) == 'SOLICITADO'} ? 'stripe-solicitado' :
                               (${#strings.toString(appt.status) == 'CONFIRMADO' or #strings.toString(appt.status) == 'LISTO_RECOGIDA'} ? 'stripe-confirmado' :
                               (${#strings.toString(appt.status) == 'CANCELADO' or #strings.toString(appt.status) == 'RECHAZADA'} ? 'stripe-cancelado' :
                               (${#strings.toString(appt.status) == 'EN_TALLER' or #strings.toString(appt.status) == 'RECOGIDO'} ? 'stripe-taller' : 'stripe-reparacion')))">
            </div>

            <div class="appt-card-body">
                <div class="appt-card-header">
                    <div>
                        <div class="appt-date" th:text="${#temporals.format(appt.startDate, 'dd MMM yyyy')}"></div>
                        <div class="appt-time">
                            <i class="bi bi-clock"></i>
                            <span th:text="${#temporals.format(appt.startDate, 'HH:mm')} + ' h'"></span>
                        </div>
                    </div>

                    <span class="status-badge"
                          th:classappend="${#strings.toString(appt.status) == 'SOLICITADO'} ? 'status-solicitado' :
                                        (${#strings.toString(appt.status) == 'CONFIRMADO' or #strings.toString(appt.status) == 'LISTO_RECOGIDA'} ? 'status-confirmado' :
                                        (${#strings.toString(appt.status) == 'CANCELADO' or #strings.toString(appt.status) == 'RECHAZADA'} ? 'status-cancelado' :
                                        (${#strings.toString(appt.status) == 'EN_TALLER' or #strings.toString(appt.status) == 'RECOGIDO'} ? 'status-taller' : 'status-reparacion')))">

                        <i th:class="${#strings.toString(appt.status) == 'SOLICITADO'} ? 'bi bi-hourglass-split' :
                                   (${#strings.toString(appt.status) == 'CANCELADO' or #strings.toString(appt.status) == 'RECHAZADA'} ? 'bi bi-x-circle-fill' : 'bi bi-gear-fill')"></i>
                        <span th:text="${appt.status.displayName}"></span>
                    </span>
                </div>

                <div class="appt-info-row">
                    <i class="bi bi-car-front-fill"></i>
                    <span th:text="${appt.vehicleModel}">Vehículo</span>
                </div>
                <div class="appt-info-row mt-1">
                    <i class="bi bi-building"></i>
                    <span th:text="${appt.workshopName}">Taller</span>
                </div>

                <div class="appt-card-footer">
                    <a th:href="@{/appointments/{id}(id=${appt.id})}" class="btn-detail-appt">
                        <i class="bi bi-eye"></i> Detalle
                    </a>

                    <form sec:authorize="hasRole('CLIENT')"
                          th:if="${#strings.toString(appt.status) == 'SOLICITADO' or #strings.toString(appt.status) == 'CONFIRMADO'}"
                          th:action="@{/appointments/{id}/cancel(id=${appt.id})}" method="post"
                          onsubmit="openCancelModal(event, this)"
                          style="flex: 1; display: flex;">
                        <button type="submit" class="btn-cancel-appt w-100">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </button>
                    </form>

                    <a sec:authorize="hasRole('CLIENT')"
                       th:if="${#strings.toString(appt.status) == 'RECOGIDO'}"
                       th:href="@{/reviews/new(workshopId=${appt.workshopId})}"
                       class="btn-modern btn-warning-modern"
                       style="flex: 1; padding: 0.45rem 0.9rem; font-size: 0.78rem; text-decoration: none;">
                        <i class="bi bi-star-fill"></i> Valorar Taller
                    </a>

                    <form sec:authorize="hasRole('CLIENT')"
                          th:if="${#strings.toString(appt.status) == 'CANCELADO' or #strings.toString(appt.status) == 'RECHAZADA' or #strings.toString(appt.status) == 'RECOGIDO'}"
                          th:action="@{/appointments/{id}/archive(id=${appt.id})}" method="post"
                          style="flex: 1; display: flex;">
                        <button type="submit" class="btn-cancel-appt w-100" style="color: #555; border-color: #ddd;" title="Ocultar de esta vista">
                            <i class="bi bi-archive"></i> Ocultar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <nav class="pagination-bar" th:if="${appointmentsPage != null and appointmentsPage.totalPages > 1}">
        <a class="page-btn" th:classappend="${appointmentsPage.first} ? 'disabled'"
           th:href="@{/appointments/history(page=${appointmentsPage.number - 1})}">
            <i class="bi bi-chevron-left"></i>
        </a>
        <a class="page-btn"
           th:each="i : ${#numbers.sequence(0, appointmentsPage.totalPages - 1)}"
           th:classappend="${i == appointmentsPage.number} ? 'active'"
           th:href="@{/appointments/history(page=${i})}"
           th:text="${i + 1}"></a>
        <a class="page-btn" th:classappend="${appointmentsPage.last} ? 'disabled'"
           th:href="@{/appointments/history(page=${appointmentsPage.number + 1})}">
            <i class="bi bi-chevron-right"></i>
        </a>
    </nav>

    <div style="text-align: center; margin-top: 4rem; padding-top: 2rem; border-top: 1px solid #e0e0e0;">
        <a th:href="@{/appointments}" class="btn-modern btn-primary-modern">
            <i class="bi bi-arrow-left"></i> Volver a mis citas activas
        </a>
    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
