<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TallerGO — Mecánicos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <th:block th:replace="~{fragments/navbar :: navbarCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/views.css}"/>
</head>

<body class="mechanics-page">

<nav th:replace="~{fragments/navbar :: navbar('mechanics')}"></nav>

<div class="page-hero">
    <div class="page-hero-inner" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1.5rem;">
        <div class="page-hero-text">
            <div class="page-label" th:text="#{msg.label.mechanics}">Personal</div>
            <h1 th:text="#{msg.mecanico.list.title}">Mecánicos</h1>
            <p th:text="#{msg.mecanico.list.subtitle}">Equipo de profesionales del taller.</p>
        </div>

        <a th:href="@{/mechanics/new}"
           class="btn-new"
           sec:authorize="hasAnyRole('ADMIN','WORKSHOP_ADMIN')">
            <i class="bi bi-plus-lg"></i>
            <span th:text="#{msg.mecanico.action.new}">Nuevo Mecánico</span>
        </a>
    </div>

    <form th:action="@{/mechanics}" method="get" class="workshop-search-form">
        <div class="workshop-search-wrap">
            <i class="bi bi-search workshop-search-icon"></i>

            <input type="text"
                   name="q"
                   class="workshop-search-input"
                   th:placeholder="#{msg.mecanico.list.search.placeholder}"
                   th:value="${q}"
                   autocomplete="off"/>

            <button type="submit"
                    class="workshop-search-btn"
                    th:text="#{msg.common.search}">
                Buscar
            </button>

            <a th:if="${q != null and !#strings.isEmpty(q)}"
               th:href="@{/mechanics}"
               class="workshop-search-clear"
               th:title="#{msg.common.cancel}">
                <i class="bi bi-x-lg"></i>
            </a>
        </div>
    </form>
</div>

<div class="mec-main">

    <div th:if="${success}" class="alert-success-custom">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${success}"></span>
    </div>

    <div th:if="${successMessage}" class="alert-success-custom">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${error}" class="alert-error-custom">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span th:text="${error}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert-error-custom">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="mec-toolbar">
        <h2>
            <span th:text="${page.totalElements}">0</span>
            <span th:text="#{msg.mechanic.list.count}">mecánicos en nuestra red</span>
        </h2>
    </div>

    <div th:if="${q != null and !#strings.isEmpty(q)}" class="search-results-info">
        <i class="bi bi-funnel"></i>
        <span th:text="#{msg.common.search}">Buscar</span>
        <strong th:text="${q}"></strong>
        &nbsp;·&nbsp;
        <span th:text="${page.totalElements}"></span>
        <span th:text="#{msg.mechanic.list.count}">mecánicos en nuestra red</span>
    </div>

    <div class="mec-grid">
        <div class="mec-empty" th:if="${page.content.isEmpty()}">
            <i class="bi bi-person-x"></i>
            <p th:text="#{msg.mechanic-list.empty}">No hay mecánicos registrados todavía.</p>
        </div>

        <div class="mec-card" th:each="m,iter : ${page.content}">
            <div class="mec-card-avatar">
                <i class="bi bi-person-circle avatar-icon"></i>
                <span class="specialty-badge" th:text="${m.specialty}">Especialidad</span>
            </div>

            <div class="mec-card-body">
                <div class="mec-card-name" th:text="${m.name}">Nombre</div>

                <div class="mec-card-workshop">
                    <i class="bi bi-building"></i>
                    <span th:text="${m.workshopName}">Taller</span>
                </div>

                <div class="mec-card-actions">
                    <a th:href="@{/mechanics/detail(id=${m.id})}" class="btn-detail-mec">
                        <i class="bi bi-eye"></i>
                        <span th:text="#{msg.common.viewDetail}">Ver ficha</span>
                    </a>

                    <form th:action="@{/mechanics/delete}"
                          method="post"
                          style="flex:1;display:contents;"
                          sec:authorize="hasAnyRole('ADMIN','WORKSHOP_ADMIN')"
                          onsubmit="openDeleteMechanicModal(event, this)">
                        <input type="hidden" name="id" th:value="${m.id}"/>
                        <button type="submit" class="btn-delete-mec">
                            <i class="bi bi-person-dash"></i>
                            <span th:text="#{msg.common.delete}">Eliminar</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="mec-pagination" th:if="${page.totalPages > 1}">
        <a th:href="@{/mechanics(page=${page.number - 1}, q=${q})}" th:if="${page.hasPrevious()}">
            <i class="bi bi-chevron-left"></i>
        </a>

        <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
            <span class="current" th:if="${i == page.number}" th:text="${i + 1}"></span>
            <a th:unless="${i == page.number}"
               th:href="@{/mechanics(page=${i}, q=${q})}"
               th:text="${i + 1}"></a>
        </th:block>

        <a th:href="@{/mechanics(page=${page.number + 1}, q=${q})}" th:if="${page.hasNext()}">
            <i class="bi bi-chevron-right"></i>
        </a>
    </div>
</div>

<div id="deleteMechanicModal" class="tgo-modal-overlay" aria-hidden="true">
    <div class="tgo-modal" role="dialog" aria-modal="true" aria-labelledby="deleteMechanicModalTitle">
        <div class="tgo-modal-header">
            <h5 id="deleteMechanicModalTitle">
                <i class="bi bi-exclamation-triangle"></i>
                <span th:text="#{msg.common.delete}">Eliminar</span>
            </h5>
            <button type="button" class="tgo-modal-close" onclick="closeDeleteMechanicModal()" aria-label="Cerrar">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="tgo-modal-body">
            <p th:text="#{msg.mecanico.delete.confirm}">
                ¿Seguro que quieres eliminar a este mecánico?
            </p>
        </div>

        <div class="tgo-modal-footer">
            <button type="button"
                    class="btn-cancel"
                    onclick="closeDeleteMechanicModal()"
                    th:text="#{msg.common.cancel}">
                Cancelar
            </button>

            <button type="button"
                    class="btn-submit"
                    id="confirmDeleteMechanicBtn"
                    th:text="#{msg.common.delete}">
                Eliminar
            </button>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.style.animation = 'fadeUp 0.5s ease forwards';
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.mec-card').forEach((el, i) => {
        el.style.opacity = '0';
        el.style.animationDelay = `${i * 0.06}s`;
        observer.observe(el);
    });

    let mechanicFormToDelete = null;

    function openDeleteMechanicModal(event, formElement) {
        event.preventDefault();
        mechanicFormToDelete = formElement;
        document.getElementById('deleteMechanicModal').classList.add('open');
        document.getElementById('deleteMechanicModal').setAttribute('aria-hidden', 'false');
    }

    function closeDeleteMechanicModal() {
        document.getElementById('deleteMechanicModal').classList.remove('open');
        document.getElementById('deleteMechanicModal').setAttribute('aria-hidden', 'true');
        mechanicFormToDelete = null;
    }

    document.getElementById('confirmDeleteMechanicBtn').addEventListener('click', function () {
        if (mechanicFormToDelete) {
            mechanicFormToDelete.submit();
        }
    });

    document.getElementById('deleteMechanicModal').addEventListener('click', function (e) {
        if (e.target === this) {
            closeDeleteMechanicModal();
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            closeDeleteMechanicModal();
        }
    });
</script>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
