<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{password.reset.title}">Restablecer contraseña</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <th:block th:replace="~{fragments/navbar :: navbarCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/views.css}"/>
</head>

<body class="reset-password-page">

<nav th:replace="~{fragments/navbar :: navbar('')}"></nav>

<div class="page-hero">
    <div class="page-hero-inner">
        <div class="page-label" th:text="#{msg.password-reset.forgot.label}">Acceso</div>
        <h1 th:text="#{password.reset.title}">Restablecer contraseña</h1>
        <p th:text="#{password.reset.subtitle}">Introduce tu nueva contraseña y confírmala para recuperar el acceso a tu cuenta.</p>
    </div>
</div>

<main class="form-main xnarrow">
    <div class="form-card">
        <div class="form-card-body">

            <div id="resetPasswordI18n"
                 style="display:none;"
                 th:attr="data-mismatch=#{password.reset.validation.mismatch}">
            </div>

            <div th:if="${errorMessage}" class="alert-error-custom">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/auth/reset-password}"
                  th:object="${dto}"
                  method="post"
                  class="needs-validation"
                  novalidate>

                <input type="hidden" th:field="*{token}"/>

                <div class="field-group">
                    <label for="newPassword">
                        <i class="bi bi-lock"></i>
                        <span th:text="#{password.reset.newPassword.label}">Nueva contraseña</span>
                    </label>
                    <input type="password"
                           id="newPassword"
                           th:field="*{newPassword}"
                           class="form-control"
                           required
                           minlength="8"
                           autofocus />

                    <div class="invalid-feedback-custom">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:text="#{msg.password-reset.password.validation}">La contraseña debe tener al menos 8 caracteres.</span>
                    </div>

                    <div class="field-error"
                         th:if="${#fields.hasErrors('newPassword')}"
                         th:errors="*{newPassword}">
                    </div>
                </div>

                <div class="field-group">
                    <label for="confirmPassword">
                        <i class="bi bi-shield-lock"></i>
                        <span th:text="#{password.reset.confirmPassword.label}">Confirmar contraseña</span>
                    </label>
                    <input type="password"
                           id="confirmPassword"
                           th:field="*{confirmPassword}"
                           class="form-control"
                           required
                           minlength="8" />

                    <div class="invalid-feedback-custom">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:text="#{msg.password-reset.confirm.validation}">Debes confirmar la contraseña.</span>
                    </div>

                    <div class="field-error"
                         th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}">
                    </div>
                </div>

                <div class="form-card-footer"
                     style="padding: 1.2rem 0 0; border-top: 1.5px solid #f0f0f0; margin-top: 0.5rem;">
                    <button type="submit" class="btn-submit">
                        <i class="bi bi-check-circle"></i>
                        <span th:text="#{password.reset.submit}">Cambiar contraseña</span>
                    </button>

                    <a th:href="@{/auth/forgot-password}" class="btn-back">
                        <i class="bi bi-arrow-left"></i>
                        <span th:text="#{password.reset.back.forgot}">Solicitar nuevo enlace</span>
                    </a>
                </div>

                <div style="margin-top: 1rem; text-align: center;">
                    <a th:href="@{/login}"
                       style="font-size: 0.9rem; color: #666; text-decoration: none;"
                       th:text="#{password.reset.back.login}">
                        Volver al inicio de sesión
                    </a>
                </div>
            </form>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector(".needs-validation");
        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");
        const i18n = document.getElementById("resetPasswordI18n");
        const mismatchMessage = i18n ? i18n.dataset.mismatch : "Las contraseñas no coinciden";

        if (!form || !newPassword || !confirmPassword) {
            return;
        }

        function validatePasswordMatch() {
            if (newPassword.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity(mismatchMessage);
            } else {
                confirmPassword.setCustomValidity("");
            }
        }

        form.addEventListener("submit", function (event) {
            validatePasswordMatch();

            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();

                const firstInvalidField = form.querySelector(":invalid");
                if (firstInvalidField) {
                    firstInvalidField.scrollIntoView({ behavior: "smooth", block: "center" });
                    setTimeout(() => firstInvalidField.focus(), 300);
                }
            }

            form.classList.add("was-validated");
        });

        confirmPassword.addEventListener("input", validatePasswordMatch);
        newPassword.addEventListener("input", function () {
            if (confirmPassword.value.length > 0) {
                validatePasswordMatch();
            }
        });
    });
</script>

</body>
</html>
