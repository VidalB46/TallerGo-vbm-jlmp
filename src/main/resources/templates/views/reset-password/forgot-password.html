<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{password.reset.forgot.title}">Recuperar contraseña</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <th:block th:replace="~{fragments/navbar :: navbarCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/views.css}"/>
</head>

<body class="forgot-password-page">

<nav th:replace="~{fragments/navbar :: navbar('')}"></nav>

<div class="page-hero">
    <div class="page-hero-inner">
        <div class="page-label" th:text="#{msg.password-reset.forgot.label}">Acceso</div>
        <h1 th:text="#{password.reset.forgot.title}">¿Olvidaste tu contraseña?</h1>
        <p th:text="#{password.reset.forgot.info}">Introduce tu correo y te enviaremos un enlace para restablecerla.</p>
    </div>
</div>

<main class="form-main xnarrow">
    <div class="form-card">

        <div class="form-card-body">

            <div th:if="${successMessage}" class="alert-success-custom">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${successMessage}"></span>
            </div>

            <div th:if="${errorMessage}" class="alert-error-custom">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/auth/forgot}"
                  th:object="${dto}"
                  method="post"
                  class="needs-validation"
                  novalidate>

                <div class="field-group">
                    <label for="email">
                        <i class="bi bi-envelope"></i>
                        <span th:text="#{password.reset.email.label}">Email</span>
                    </label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           class="form-control"
                           th:placeholder="#{password.reset.email.placeholder}"
                           required />
                    <div class="invalid-feedback-custom">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:text="#{msg.password-reset.email.validation}">Introduce un email válido.</span>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('email')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{email}"></span>
                    </div>
                </div>

                <div class="form-card-footer" style="padding: 1.2rem 0 0; border-top: 1.5px solid #f0f0f0; margin-top: 0.5rem;">
                    <button type="submit" class="btn-submit">
                        <i class="bi bi-send"></i>
                        <span th:text="#{password.reset.forgot.submit}">Enviar enlace</span>
                    </button>

                    <a th:href="@{/login}" class="btn-back">
                        <i class="bi bi-arrow-left"></i>
                        <span th:text="#{password.reset.back.login}">Volver al login</span>
                    </a>
                </div>
            </form>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
