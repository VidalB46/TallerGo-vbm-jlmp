<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TallerGO — Nueva Reseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <th:block th:replace="~{fragments/navbar :: navbarCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/views.css}"/>
</head>

<body class="form-page">
<nav th:replace="~{fragments/navbar :: navbar('workshops')}"></nav>

<div class="page-hero text-center">
    <div class="page-hero-inner">
        <div class="page-label" th:text="#{msg.review-form.label}">Feedback</div>
        <h1 th:text="#{msg.review-form.title}">Cuéntanos tu experiencia</h1>
        <p><span th:text="#{msg.review-form.valuating}">Valorando a:</span> <strong th:text="${workshop.name}" style="color: #fff;">Taller</strong></p>
    </div>
</div>

<main class="form-main narrow overlap">
    <div th:if="${error}" class="alert-error-custom mb-4">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
    </div>

    <div class="form-card">
        <form th:action="@{/reviews/new}" th:object="${review}" method="post">
            <input type="hidden" th:field="*{workshopId}" />

            <div class="form-card-body" style="padding-top: 1rem; display: flex; flex-direction: column; gap: 1.5rem;">

                <div>
                    <label for="rating" style="display: block; font-size: 0.78rem; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem;">
                        <i class="bi bi-star-fill" style="color: #f59e0b;"></i> <span th:text="#{msg.review-form.rating.label}">Puntuación</span>
                    </label>
                    <select th:field="*{rating}" id="rating" class="form-control" required
                            th:classappend="${#fields.hasErrors('rating')} ? 'is-invalid'"
                            style="cursor: pointer;">
                        <option value="5" th:text="#{msg.review-form.rating.5}">⭐⭐⭐⭐⭐ (5 - Excelente)</option>
                        <option value="4" th:text="#{msg.review-form.rating.4}">⭐⭐⭐⭐ (4 - Muy bueno)</option>
                        <option value="3" th:text="#{msg.review-form.rating.3}">⭐⭐⭐ (3 - Normal)</option>
                        <option value="2" th:text="#{msg.review-form.rating.2}">⭐⭐ (2 - Regular)</option>
                        <option value="1" th:text="#{msg.review-form.rating.1}">⭐ (1 - Malo)</option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>
                </div>

                <div>
                    <label for="comment" style="display: block; font-size: 0.78rem; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem;">
                        <i class="bi bi-chat-quote" style="color: #c0392b;"></i> <span th:text="#{msg.review-form.comment.label}">Tu comentario</span>
                    </label>
                    <textarea th:field="*{comment}" id="comment" class="form-control" rows="5" required
                              th:classappend="${#fields.hasErrors('comment')} ? 'is-invalid'"
                              th:placeholder="#{msg.review-form.comment.placeholder}"></textarea>
                    <div class="field-error" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"></div>
                </div>

            </div>

            <div class="form-card-footer spread">
                <a th:href="@{/workshops}" class="btn-modern btn-outline" th:text="#{msg.review-form.cancel}">Cancelar</a>
                <button type="submit" class="btn-modern btn-primary-modern">
                    <i class="bi bi-send"></i> <span th:text="#{msg.review-form.submit}">Enviar Reseña</span>
                </button>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
