<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TallerGO — Usuarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <th:block th:replace="~{fragments/navbar :: navbarCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/views.css}"/>
</head>
<body class="users-page">

<nav th:replace="~{fragments/navbar :: navbar('users')}"></nav>

<div class="page-hero">
    <div class="page-hero-inner" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1.5rem;">
        <div class="page-hero-text">
            <div class="page-label" th:text="#{msg.user-list.directory}">Administración</div>
            <h1 th:text="#{msg.user-list.title}">Usuarios</h1>
            <p th:text="#{msg.user-list.subtitle}">Gestiona las cuentas y permisos de los usuarios del sistema.</p>
        </div>
        <a th:href="@{/users/new}" class="btn-new" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-person-plus-fill"></i> <span th:text="#{msg.user-list.add}">Nuevo Usuario</span>
        </a>
    </div>

    <form th:action="@{/users}" method="get" class="workshop-search-form">
        <div class="workshop-search-wrap">
            <i class="bi bi-search workshop-search-icon"></i>
            <input type="text" name="q" class="workshop-search-input"
                   th:placeholder="#{msg.user-list.search.placeholder}"
                   th:value="${q}" autocomplete="off"/>
            <button type="submit" class="workshop-search-btn" th:text="#{msg.user-list.search.btn}">Buscar</button>
            <a th:if="${q != null and !#strings.isEmpty(q)}"
               th:href="@{/users}" class="workshop-search-clear" title="Limpiar">
                <i class="bi bi-x-lg"></i>
            </a>
        </div>
    </form>
</div>

<main class="users-main">

    <div th:if="${errorMessage}" class="alert-error-custom">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <div th:if="${q != null and !#strings.isEmpty(q)}" class="search-results-info">
        <i class="bi bi-funnel"></i>
        Resultados para: <strong th:text="${q}"></strong>
        &nbsp;·&nbsp; <span th:text="${page.totalElements}"></span> usuario(s)
    </div>

    <div class="users-table-wrap table-scroll">
        <table>
            <thead>
            <tr>
                <th th:with="order=${page.sort.getOrderFor('id')}, dir=${order != null ? order.direction.name().toLowerCase() : 'asc'}, nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                    <a th:href="@{/users(page=${page.number}, size=${page.size}, sort=${'id,' + nextDir})}">
                        ID <span th:if="${order != null}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>
                <th th:with="order=${page.sort.getOrderFor('email')}, dir=${order != null ? order.direction.name().toLowerCase() : 'asc'}, nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                    <a th:href="@{/users(page=${page.number}, size=${page.size}, sort=${'email,' + nextDir})}">
                        Email <span th:if="${order != null}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>
                <th th:text="#{msg.user-list.col.roles}">Roles</th>
                <th th:text="#{msg.user-list.active}">Estado</th>
                <th th:text="#{msg.user-list.actions}">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${page.content}">
                <td th:text="${u.id}"></td>
                <td>
                    <div style="display:flex;align-items:center;gap:0.5rem;">
                        <i class="bi bi-person-circle" style="color:#c0392b;font-size:1.1rem;"></i>
                        <span th:text="${u.email}"></span>
                    </div>
                </td>
                <td>
                    <span th:each="role : ${u.roles}" class="badge-role" th:text="${role}"></span>
                </td>
                <td>
                    <span th:if="${u.active}" class="badge-active"><i class="bi bi-check-circle-fill"></i> <span th:text="#{msg.bool.yes}">Activo</span></span>
                    <span th:unless="${u.active}" class="badge-inactive"><i class="bi bi-x-circle-fill"></i> <span th:text="#{msg.bool.no}">Inactivo</span></span>
                </td>
                <td>
                    <div class="td-actions">
                        <a th:href="@{/users/detail(id=${u.id})}" class="btn-view-sm"><i class="bi bi-eye"></i> <span th:text="#{msg.user-list.btn.view}">Ver</span></a>
                        <a th:href="@{/users/edit(id=${u.id})}" class="btn-edit-sm"><i class="bi bi-pencil"></i> <span th:text="#{msg.user-list.btn.edit}">Editar</span></a>
                        <form th:action="@{/users/delete}" method="post" style="display:inline;"
                              th:attr="onsubmit='return confirm(\'' + #{msg.user-list.delete.confirm} + '\')'" 
                              sec:authorize="hasRole('ADMIN')">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                            <input type="hidden" name="id" th:value="${u.id}"/>
                            <button type="submit" class="btn-delete-sm"><i class="bi bi-trash"></i> <span th:text="#{msg.user-list.btn.delete}">Eliminar</span></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="pagination-bar" th:if="${page.totalPages > 1}">
        <a class="page-btn" th:classappend="${page.first} ? 'disabled'" th:href="@{/users(page=${page.number - 1}, size=${page.size}, sort=${sortParam}, q=${q})}"><i class="bi bi-chevron-left"></i></a>
        <a class="page-btn" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i == page.number} ? 'active'" th:href="@{/users(page=${i}, size=${page.size}, sort=${sortParam}, q=${q})}" th:text="${i + 1}"></a>
        <a class="page-btn" th:classappend="${page.last} ? 'disabled'" th:href="@{/users(page=${page.number + 1}, size=${page.size}, sort=${sortParam}, q=${q})}"><i class="bi bi-chevron-right"></i></a>
    </nav>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
