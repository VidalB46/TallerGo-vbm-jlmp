<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TallerGO — Marcas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <th:block th:replace="~{fragments/navbar :: navbarCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/views.css}"/>
</head>
<body class="brand-list-page">

<nav th:replace="~{fragments/navbar :: navbar('brands')}"></nav>

<div class="page-hero">
    <div class="page-hero-inner" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1.5rem;">
        <div class="page-hero-text">
            <div class="page-label">Gestión</div>
            <h1 th:text="#{msg.brand-list.title}">Marcas</h1>
            <p th:text="#{msg.brand-list.subtitle}">Administra las marcas de vehículos del taller.</p>
        </div>
        <a th:href="@{/brands/new}" class="btn-hero-new" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-plus-lg"></i> <span th:text="#{msg.brand-list.add}">Nueva Marca</span>
        </a>
    </div>

    <!-- Buscador + Filtro por país -->
    <form th:action="@{/brands}" method="get" class="workshop-search-form">
        <div class="workshop-search-wrap">
            <i class="bi bi-search workshop-search-icon"></i>
            <input type="text" name="q" class="workshop-search-input"
                   th:placeholder="#{msg.brand-list.search.placeholder}"
                   th:value="${q}" autocomplete="off"/>
            <div class="brand-country-divider"></div>
            <select name="country" class="brand-country-select">
                <option value="" th:selected="${country == null or #strings.isEmpty(country)}" th:text="#{msg.brand-list.country.all}">Todos los países</option>
                <option th:each="c : ${countries}" th:value="${c}" th:text="${c}" th:selected="${c == country}"></option>
            </select>
            <button type="submit" class="workshop-search-btn" th:text="#{msg.brand-list.filter.btn}">Filtrar</button>
            <a th:if="${(q != null and !#strings.isEmpty(q)) or (country != null and !#strings.isEmpty(country))}"
               th:href="@{/brands}" class="workshop-search-clear" title="Limpiar filtros">
                <i class="bi bi-x-lg"></i>
            </a>
        </div>
    </form>
</div>

<main class="list-main">
    <div class="alert-error" th:if="${errorMessage}">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="table-card">
        <div class="table-header">
            <div class="table-header-title"><i class="bi bi-shield-check"></i> Listado de marcas</div>
            <div class="table-count">
                <span th:text="${page.totalElements} + ' marca(s)'"></span>
                <span th:if="${(q != null and !#strings.isEmpty(q)) or (country != null and !#strings.isEmpty(country))}"
                      class="filter-active-badge">
                    <i class="bi bi-funnel-fill"></i> Filtros activos
                </span>
            </div>
        </div>

        <div th:if="${page.isEmpty()}">
            <div class="empty-state">
                <i class="bi bi-shield-x"></i>
                <p th:text="#{msg.brand-list.empty}">No hay marcas registradas todavía.</p>
            </div>
        </div>

        <div class="table-scroll">
            <table class="data-table" th:if="${!page.isEmpty()}">
                <thead>
                <tr>
                    <th th:text="#{msg.brand-list.id}">#</th>
                    <th th:text="#{msg.brand-list.name}">Nombre</th>
                    <th th:text="#{msg.brand-list.country}">País</th>
                    <th th:text="#{msg.brand-list.actions}">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="brand : ${page.content}">
                    <td class="td-id" th:text="${brand.id}"></td>
                    <td class="td-name" th:text="${brand.name}"></td>
                    <td>
                            <span class="td-country">
                                <i class="bi bi-geo-alt"></i>
                                <span th:text="${brand.country} ?: '—'"></span>
                            </span>
                    </td>
                    <td>
                        <div class="actions-cell">
                            <a th:href="@{/brands/detail(id=${brand.id})}" class="btn-view">
                                <i class="bi bi-eye"></i> Ver
                            </a>
                            <a th:href="@{/brands/edit(id=${brand.id})}" class="btn-edit" sec:authorize="hasRole('ADMIN')">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            <form th:action="@{/brands/delete}" method="post" class="form-delete"
                                  onsubmit="return confirm('¿Eliminar esta marca?');"
                                  sec:authorize="hasRole('ADMIN')">
                                <input type="hidden" name="id" th:value="${brand.id}"/>
                                <button type="submit" class="btn-delete">
                                    <i class="bi bi-trash"></i> Borrar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-wrap" th:if="${page.totalPages > 1}">
            <a th:href="@{/brands(page=${page.number - 1}, sort=${sortParam}, q=${q}, country=${country})}"
               class="page-btn" th:classappend="${page.first} ? 'disabled'">
                <i class="bi bi-chevron-left"></i>
            </a>
            <a th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
               th:href="@{/brands(page=${i}, sort=${sortParam}, q=${q}, country=${country})}"
               class="page-btn" th:classappend="${i == page.number} ? 'active'"
               th:text="${i + 1}"></a>
            <a th:href="@{/brands(page=${page.number + 1}, sort=${sortParam}, q=${q}, country=${country})}"
               class="page-btn" th:classappend="${page.last} ? 'disabled'">
                <i class="bi bi-chevron-right"></i>
            </a>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
