<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${brand.id != null} ? 'TallerGO — Editar Marca' : 'TallerGO — Nueva Marca'">TallerGO — Marca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <th:block th:replace="~{fragments/navbar :: navbarCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/views.css}"/>
</head>
<body class="brand-form-page">

<nav th:replace="~{fragments/navbar :: navbar('brands')}"></nav>

<div class="page-hero">
    <div class="page-hero-inner">
        <div class="page-label" th:text="#{msg.label.brands}">Marcas</div>
        <h1 th:text="${brand.id != null} ? #{msg.brand-form.title.edit} : #{msg.brand-form.title.new}">Marca</h1>
        <p th:text="${brand.id != null} ? #{msg.brand-form.subtitle.edit} : #{msg.brand-form.subtitle.new}"></p>
    </div>
</div>

<main class="form-main">
    <div class="form-card">
        <div class="form-card-header">
            <i class="bi bi-shield-plus"></i>
            <h2 th:text="${brand.id != null} ? #{msg.brand-form.heading.edit} : #{msg.brand-form.heading.new}">Marca</h2>
        </div>

        <form th:action="${brand.id != null} ? @{/brands/update} : @{/brands/insert}"
              th:object="${brand}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-card-body">

                <div class="alert-error" th:if="${errorMessage}">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <div class="form-group">
                    <label for="name" th:text="#{msg.brand-form.field.name}">Nombre</label> <span style="color:#c0392b">*</span>
                    <input type="text" id="name" class="form-control" th:field="*{name}" th:placeholder="#{msg.brand-form.name.placeholder}" required/>
                </div>

                <div class="form-group">
                    <label for="country" th:text="#{msg.brand-form.field.country}">País de origen</label>
                    <input type="text" id="country" class="form-control" th:field="*{country}" th:placeholder="#{msg.brand-form.country.placeholder}"/>
                </div>

            </div>

            <div class="form-card-footer">
                <a th:href="@{/brands}" class="btn-cancel"><i class="bi bi-x"></i> <span th:text="#{msg.common.cancel}">Cancelar</span></a>
                <button type="submit" class="btn-submit">
                    <i class="bi bi-check2"></i>
                    <span th:text="${brand.id != null} ? #{msg.brand-form.submit.edit} : #{msg.brand-form.submit.new}">Guardar</span>
                </button>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
