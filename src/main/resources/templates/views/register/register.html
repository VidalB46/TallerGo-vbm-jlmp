<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Crear Cuenta - TallerGO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        *, *::before, *::after { box-sizing: border-box; }
        body.register-page { display:flex; flex-direction:column; min-height:100vh; margin:0; padding:0; font-family:'Inter','Segoe UI',sans-serif; background:#0d0d0d; }

        @keyframes fadeDown { from{opacity:0;transform:translateY(-18px)} to{opacity:1;transform:translateY(0)} }
        @keyframes fadeUp   { from{opacity:0;transform:translateY(30px)}  to{opacity:1;transform:translateY(0)} }
        @keyframes shimmer  { 0%{background-position:-200% center} 100%{background-position:200% center} }
        @keyframes pulse-red{ 0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.4)} 50%{box-shadow:0 0 0 8px rgba(192,57,43,0)} }

        .register-topbar { position:absolute; top:0; left:0; right:0; z-index:100; padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.08); backdrop-filter:blur(12px); border-bottom:1px solid rgba(255,255,255,.1); animation:fadeDown .6s ease forwards; }
        .register-topbar .brand-name { font-size:1.4rem; font-weight:800; color:#fff; text-decoration:none; letter-spacing:1px; display:flex; align-items:center; gap:.4rem; transition:opacity .2s; }
        .register-topbar .brand-name:hover { opacity:.85; }
        .register-topbar .brand-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#c0392b; margin-bottom:2px; animation:pulse-red 2s infinite; }
        .register-topbar .topbar-nav { display:flex; gap:1.5rem; list-style:none; margin:0; padding:0; }
        .register-topbar .topbar-nav a { color:rgba(255,255,255,.75); text-decoration:none; font-size:.85rem; font-weight:500; transition:color .2s; }
        .register-topbar .topbar-nav a:hover { color:#fff; }

        .register-hero { flex:1; position:relative; background-image:url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=1920&q=90'); background-size:cover; background-position:center 40%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8rem 1rem 4rem; min-height:100vh; overflow:hidden; }
        .register-hero::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(0,0,0,.75) 0%,rgba(10,10,20,.55) 50%,rgba(0,0,0,.70) 100%); z-index:0; }
        .register-hero::after  { content:''; position:absolute; bottom:-80px; left:-80px; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle,rgba(192,57,43,.18) 0%,transparent 70%); z-index:0; pointer-events:none; }

        .register-hero-content { position:relative; z-index:1; text-align:center; width:100%; max-width:480px; }
        .register-badge { display:inline-flex; align-items:center; gap:.4rem; background:rgba(192,57,43,.15); border:1px solid rgba(192,57,43,.35); color:#e88080; font-size:.75rem; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; padding:.3rem .9rem; border-radius:99px; margin-bottom:1rem; animation:fadeUp .5s .1s ease both; }
        .register-hero-content h1 { color:#fff; font-size:2.2rem; font-weight:800; line-height:1.15; margin-bottom:.5rem; text-shadow:0 4px 20px rgba(0,0,0,.6); animation:fadeUp .6s .2s ease both; }
        .register-hero-content h1 span { background:linear-gradient(90deg,#e74c3c,#c0392b,#e74c3c); background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:shimmer 3s linear infinite; }
        .register-hero-content p.subtitle { color:rgba(255,255,255,.65); font-size:.95rem; margin-bottom:2rem; animation:fadeUp .6s .3s ease both; }

        .register-card { background:rgba(255,255,255,.97); border-radius:20px; padding:2.2rem 2rem 1.8rem; box-shadow:0 2px 0 rgba(255,255,255,.08) inset,0 20px 60px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.2); width:100%; animation:fadeUp .7s .35s ease both; transition:transform .3s,box-shadow .3s; }
        .register-card:hover { transform:translateY(-2px); box-shadow:0 2px 0 rgba(255,255,255,.08) inset,0 28px 70px rgba(0,0,0,.45),0 4px 20px rgba(0,0,0,.25); }

        .input-group-float { position:relative; margin-bottom:1.4rem; }
        .input-group-float .float-label { position:absolute; top:50%; left:.9rem; transform:translateY(-50%); font-size:.88rem; font-weight:500; color:#888; pointer-events:none; transition:all .2s ease; background:transparent; padding:0 .2rem; }
        .input-group-float .float-input { width:100%; border:1.5px solid #e0e0e0; border-radius:10px; padding:.85rem 2.4rem .4rem .9rem; font-size:.95rem; font-family:inherit; background:#fafafa; color:#1a1a1a; outline:none; transition:border-color .25s,box-shadow .25s,background .25s; }
        .input-group-float .float-input:focus, .input-group-float .float-input:not(:placeholder-shown) { background:#fff; border-color:#c0392b; }
        .input-group-float .float-input:focus { box-shadow:0 0 0 3px rgba(192,57,43,.12); }
        .input-group-float .float-input:focus ~ .float-label, .input-group-float .float-input:not(:placeholder-shown) ~ .float-label { top:.55rem; font-size:.72rem; color:#c0392b; font-weight:600; }
        .input-group-float .input-icon { position:absolute; right:.9rem; top:50%; transform:translateY(-50%); color:#bbb; font-size:1rem; transition:color .2s; cursor:pointer; }
        .input-group-float .float-input:focus ~ .input-icon { color:#c0392b; }

        .field-error { color:#dc3545; font-size:.78rem; margin-top:.3rem; display:flex; align-items:center; gap:.3rem; }

        /* Reglas para la validación del lado del cliente */
        .was-validated .float-input:invalid { border-color:#dc3545; background:#fff8f8; }
        .invalid-feedback-custom { display:none; color:#dc3545; font-size:.78rem; margin-top:.25rem; font-weight: 500;}
        .was-validated .float-input:invalid ~ .invalid-feedback-custom { display:block; animation: fadeDown 0.2s ease;}

        .btn-register { position:relative; overflow:hidden; background:linear-gradient(135deg,#c0392b 0%,#96281b 100%); border:none; color:#fff; font-weight:700; font-size:.98rem; letter-spacing:.5px; padding:.8rem; border-radius:10px; width:100%; cursor:pointer; transition:transform .15s,box-shadow .25s; box-shadow:0 4px 18px rgba(192,57,43,.35); margin-top:.4rem; font-family:inherit; }
        .btn-register:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(192,57,43,.45); }
        .btn-register:active { transform:translateY(0); }

        .register-alert { border-radius:10px; font-size:.85rem; padding:.65rem .9rem; margin-bottom:1rem; display:flex; align-items:center; gap:.5rem; }
        .register-alert.error { background:rgba(192,57,43,.08); border:1px solid rgba(192,57,43,.25); color:#a93226; }

        .register-footer-link { text-align:center; margin-top:1.2rem; font-size:.83rem; color:#888; }
        .register-footer-link a { color:#c0392b; text-decoration:none; font-weight:600; }
        .register-footer-link a:hover { text-decoration:underline; }

        @media(max-width:640px) {
            .register-hero-content h1 { font-size:1.7rem; }
            .register-topbar .topbar-nav { display:none; }
            .register-card { padding:1.6rem 1.3rem 1.4rem; }
        }
    </style>
</head>

<body class="register-page">

<header class="register-topbar">
    <a th:href="@{/}" class="brand-name">TallerGO<span class="brand-dot"></span></a>
    <ul class="topbar-nav">
        <li><a th:href="@{/}">Inicio</a></li>
        <li><a th:href="@{/login}">Iniciar Sesión</a></li>
    </ul>
</header>

<section class="register-hero">
    <div class="register-hero-content">

        <div class="register-badge"><i class="bi bi-person-plus-fill"></i> <span th:text="#{msg.register.badge}">Únete gratis</span></div>
        <h1 th:text="#{msg.register.title}">Crea tu cuenta en TallerGO</h1>
        <p class="subtitle" th:text="#{msg.register.subtitle}">Gestiona tus vehículos y citas en segundos.</p>

        <div class="register-card">

            <div th:if="${errorMessage}" class="register-alert error">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/register}" th:object="${userDto}" method="post" class="needs-validation-fast" novalidate>

                <div class="input-group-float">
                    <input type="email" id="email" th:field="*{email}" class="float-input" placeholder=" " required autofocus
                           th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"/>
                    <label for="email" class="float-label" th:text="#{spring.security.ui.login.username}">Email</label>
                    <i class="bi bi-envelope input-icon"></i>
                    <div th:if="${#fields.hasErrors('email')}" class="field-error">
                        <i class="bi bi-exclamation-circle-fill"></i><span th:errors="*{email}"></span>
                    </div>
                </div>

                <div class="input-group-float">
                    <input type="password" id="password" th:field="*{password}" class="float-input" placeholder=" " required
                           th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'"/>
                    <label for="password" class="float-label" th:text="#{spring.security.ui.login.password}">Contraseña</label>
                    <i class="bi bi-eye input-icon" id="togglePassword"></i>
                    <div th:if="${#fields.hasErrors('password')}" class="field-error">
                        <i class="bi bi-exclamation-circle-fill"></i><span th:errors="*{password}"></span>
                    </div>
                </div>

                <div class="input-group-float">
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="float-input" placeholder=" " required
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid'"/>
                    <label for="confirmPassword" class="float-label" th:text="#{msg.register.confirmPassword}">Confirmar Contraseña</label>
                    <i class="bi bi-eye input-icon" id="toggleConfirm"></i>
                    <div th:if="${#fields.hasErrors('confirmPassword')}" class="field-error">
                        <i class="bi bi-exclamation-circle-fill"></i><span th:errors="*{confirmPassword}"></span>
                    </div>
                </div>

                <button type="submit" class="btn-register" th:text="#{msg.register.submit}">Crear cuenta</button>

            </form>

            <div class="register-footer-link">
                <span th:text="#{msg.register.hasAccount}">¿Ya tienes cuenta?</span>
                <a th:href="@{/login}" th:text="#{msg.register.loginLink}">Inicia sesión aquí</a>
            </div>

        </div>
    </div>
</section>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script th:src="@{/js/register.js}"></script>

<script>
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation-fast')
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

</body>
</html>
