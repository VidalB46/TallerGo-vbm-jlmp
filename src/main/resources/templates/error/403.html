<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'TallerGO — ' + #{msg.error.403.title}">TallerGO — 403 Acceso Denegado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <th:block th:replace="~{fragments/navbar :: navbarCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/views.css}"/>
    <link rel="stylesheet" th:href="@{/css/error.css}"/>
</head>
<body class="error-page">

<nav th:replace="~{fragments/navbar :: navbar('')}"></nav>

<div class="error-wrap">
    <div class="error-card">
        <div class="error-code">403</div>

        <div class="error-title" th:text="#{msg.error.403.title}">
            Acceso denegado
        </div>

        <p class="error-desc">
            <span th:text="#{msg.error.403.desc}">
                No tienes permisos para acceder a este recurso.
            </span>
            <br>
            <span th:text="#{msg.error.403.desc.extra}">
                Si crees que es un error, contacta con el administrador.
            </span>
        </p>

        <div class="error-meta">
            <div>
                <span th:text="#{msg.error.common.path}">Ruta</span>:
                <span th:text="${path}">/ruta</span>
            </div>
            <div style="margin-top:0.3rem">
                <span th:text="#{msg.error.common.date}">Fecha</span>:
                <span th:text="${timestamp}">timestamp</span>
            </div>
        </div>

        <div class="error-actions">
            <a th:href="@{/}" class="btn-home">
                <i class="bi bi-house-fill"></i>
                <span th:text="#{msg.error.common.home}">Volver al inicio</span>
            </a>

            <button type="button" class="btn-back js-back-button">
                <i class="bi bi-arrow-left"></i>
                <span th:text="#{msg.error.common.back}">Volver atrás</span>
            </button>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
<script th:src="@{/js/error-pages.js}" defer></script>

</body>
</html>
