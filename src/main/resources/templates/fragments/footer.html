<footer th:fragment="footer"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        class="tgo-footer">

    <div class="tgo-footer-grid">

        <div class="tgo-footer-brand-block">
            <div class="tgo-footer-brand">
                TallerGO<span class="tgo-footer-brand-dot"></span>
            </div>
            <p class="tgo-footer-description" th:text="#{msg.footer.description}">
                Simplificando la gestión de tu taller, conectando conductores con profesionales de confianza.
            </p>
        </div>

        <div class="tgo-footer-col">
            <h4 class="tgo-footer-title" th:text="#{msg.footer.nav.title}">Navegación</h4>
            <a th:href="@{/}" class="tgo-footer-link" th:text="#{msg.footer.nav.home}">Inicio</a>
            <a th:href="@{/workshops}" class="tgo-footer-link" th:text="#{msg.footer.nav.workshops}">Talleres</a>
            <a sec:authorize="hasAnyRole('ADMIN', 'WORKSHOP_ADMIN')"
               th:href="@{/mechanics}"
               class="tgo-footer-link"
               th:text="#{msg.footer.nav.mechanics}">Mecánicos</a>
        </div>

        <div class="tgo-footer-col">
            <h4 class="tgo-footer-title" th:text="#{msg.footer.legal.title}">Legal</h4>
            <a href="#" class="tgo-footer-link" th:text="#{msg.footer.legal.privacy}">Política de Privacidad</a>
            <a href="#" class="tgo-footer-link" th:text="#{msg.footer.legal.terms}">Términos de uso</a>
        </div>

        <div class="tgo-footer-col">
            <h4 class="tgo-footer-title" th:text="#{msg.footer.contact.title}">Contacto</h4>
            <a href="mailto:tallerGO@gmail.com" class="tgo-footer-link">tallerGO@gmail.com</a>
        </div>

    </div>

    <div class="tgo-footer-bottom">
        <span th:text="#{msg.footer.copyright}">© 2026 TallerGO — Todos los derechos reservados.</span>
    </div>

</footer>
