<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<nav th:fragment="navbar(activeLink)"
     class="tgo-nav" id="tgoNav"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

    <a th:href="@{/}" class="tgo-brand">
        <img th:src="@{/images/logoTallerGO.png}" alt="TallerGO Logo" class="tgo-logo">
        TallerGO<span class="tgo-brand-dot"></span>
    </a>

    <div class="tgo-lang-wrap">
        <a th:href="@{/lang(lang=es)}" class="tgo-lang-btn" title="Español">ES</a>
        <a th:href="@{/lang(lang=en)}" class="tgo-lang-btn" title="English">EN</a>
    </div>

    <ul class="tgo-links">
        <li>
            <a th:href="@{/}"
               th:classappend="${activeLink == 'home'} ? ' tgo-active'"
               th:text="#{msg.nav.home}">Inicio</a>
        </li>

        <li sec:authorize="hasAnyRole('CLIENT','ADMIN')">
            <a th:href="@{/workshops}"
               th:classappend="${activeLink == 'workshops'} ? ' tgo-active'"
               th:text="#{msg.nav.workshops}">Talleres</a>
        </li>

        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/appointments}"
               th:classappend="${activeLink == 'appointments'} ? ' tgo-active'"
               th:text="#{msg.nav.appointments}">Mis Citas</a>
        </li>

        <li sec:authorize="hasAnyRole('CLIENT','ADMIN')">
            <a th:href="@{/vehicles}"
               th:classappend="${activeLink == 'vehicles'} ? ' tgo-active'"
               th:text="#{msg.header.vehicles}">Mis Vehículos</a>
        </li>

        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/brands}"
               th:classappend="${activeLink == 'brands'} ? ' tgo-active'"
               th:text="#{msg.header.brands}">Marcas</a>
        </li>

        <li class="tgo-dd-wrap" id="ddPersonal" sec:authorize="hasAnyRole('ADMIN','WORKSHOP_ADMIN')">
            <button type="button"
                    class="tgo-dd-btn"
                    th:classappend="${activeLink == 'mechanics' or activeLink == 'users' or activeLink == 'reviews'} ? ' tgo-active'">
                <span th:text="#{msg.nav.personal}">Personal</span>
                <i class="bi bi-chevron-down tgo-chev"></i>
            </button>

            <ul class="tgo-dd-menu">
                <li>
                    <a th:href="@{/mechanics}"
                       th:classappend="${activeLink == 'mechanics'} ? ' tgo-dd-active'">
                        <i class="bi bi-tools"></i>
                        <span th:text="#{msg.nav.mecanicos}">Mecánicos</span>
                    </a>
                </li>

                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/users}"
                       th:classappend="${activeLink == 'users'} ? ' tgo-dd-active'">
                        <i class="bi bi-people"></i>
                        <span th:text="#{msg.header.users}">Usuarios</span>
                    </a>
                </li>

                <li sec:authorize="hasRole('WORKSHOP_ADMIN')">
                    <a th:href="@{/reviews/my}"
                       th:classappend="${activeLink == 'reviews'} ? ' tgo-dd-active'">
                        <i class="bi bi-star-fill"></i>
                        <span th:text="#{msg.nav.reviews}">Reseñas</span>
                    </a>
                </li>
            </ul>
        </li>

        <li sec:authorize="!isAuthenticated()">
            <a th:href="@{/register}" class="tgo-cta" th:text="#{msg.nav.register}">Registrarse</a>
        </li>

        <li sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}" class="tgo-cta tgo-cta-outline" th:text="#{msg.nav.login}">Iniciar sesión</a>
        </li>
    </ul>

    <div class="tgo-avatar-wrap" id="ddUser" sec:authorize="isAuthenticated()">
        <button type="button" class="tgo-avatar-btn">
            <i class="bi bi-person-circle"></i>
            <span class="tgo-uname" sec:authentication="name"></span>
            <i class="bi bi-chevron-down tgo-chev"></i>
        </button>

        <ul class="tgo-dd-menu tgo-dd-right">
            <li class="tgo-dd-label" sec:authentication="name"></li>
            <li class="tgo-dd-sep"></li>

            <li>
                <a th:href="@{/profile/edit}">
                    <i class="bi bi-person-gear"></i>
                    <span th:text="#{menu.editProfile}">Mi Perfil</span>
                </a>
            </li>

            <li class="tgo-dd-sep"></li>

            <li>
                <form th:action="@{/logout}" method="post" style="margin:0;padding:0;">
                    <button type="submit" class="tgo-dd-logout">
                        <i class="bi bi-box-arrow-right"></i>
                        <span th:text="#{msg.nav.logout}">Cerrar sesión</span>
                    </button>
                </form>
            </li>
        </ul>
    </div>

    <button type="button" class="tgo-hamburger" id="tgoHamburger" aria-label="Menú">
        <span></span><span></span><span></span>
    </button>

    <div class="tgo-mobile-menu" id="tgoMobileMenu">
        <th:block th:if="${#authorization.expression('!isAuthenticated()')}">
            <a th:href="@{/register}">
                <i class="bi bi-person-plus"></i>
                <span th:text="#{msg.nav.register}">Registrarse</span>
            </a>
            <a th:href="@{/login}">
                <i class="bi bi-box-arrow-in-right"></i>
                <span th:text="#{msg.nav.login}">Iniciar sesión</span>
            </a>
        </th:block>

        <th:block th:if="${#authorization.expression('isAuthenticated()')}">
            <span class="tgo-mobile-label" sec:authentication="name"></span>

            <a th:href="@{/}">
                <i class="bi bi-house"></i>
                <span th:text="#{msg.nav.home}">Inicio</span>
            </a>

            <a th:href="@{/workshops}" sec:authorize="hasAnyRole('CLIENT','ADMIN')">
                <i class="bi bi-building"></i>
                <span th:text="#{msg.nav.workshops}">Talleres</span>
            </a>

            <a th:href="@{/appointments}">
                <i class="bi bi-calendar-check"></i>
                <span th:text="#{msg.nav.appointments}">Mis Citas</span>
            </a>

            <a th:href="@{/vehicles}" sec:authorize="hasAnyRole('CLIENT','ADMIN')">
                <i class="bi bi-car-front"></i>
                <span th:text="#{msg.header.vehicles}">Mis Vehículos</span>
            </a>

            <div class="tgo-mobile-sep" sec:authorize="hasAnyRole('ADMIN','WORKSHOP_ADMIN')"></div>

            <a th:href="@{/mechanics}" sec:authorize="hasAnyRole('ADMIN','WORKSHOP_ADMIN')">
                <i class="bi bi-tools"></i>
                <span th:text="#{msg.nav.mecanicos}">Mecánicos</span>
            </a>

            <a th:href="@{/users}" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-people"></i>
                <span th:text="#{msg.header.users}">Usuarios</span>
            </a>

            <a th:href="@{/brands}" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-shield-check"></i>
                <span th:text="#{msg.header.brands}">Marcas</span>
            </a>

            <a th:href="@{/reviews/my}" sec:authorize="hasRole('WORKSHOP_ADMIN')">
                <i class="bi bi-star-fill"></i>
                <span th:text="#{msg.nav.reviews}">Reseñas</span>
            </a>

            <div class="tgo-mobile-sep"></div>

            <a th:href="@{/profile/edit}">
                <i class="bi bi-person-gear"></i>
                <span th:text="#{menu.editProfile}">Mi Perfil</span>
            </a>

            <form th:action="@{/logout}" method="post" style="margin:0; padding:0;">
                <button type="submit" class="tgo-mobile-logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span th:text="#{menu.logout}">Cerrar sesión</span>
                </button>
            </form>
        </th:block>

        <div class="tgo-mobile-sep"></div>
        <div style="display:flex; gap:0.6rem; justify-content:center; padding:0.5rem 0;">
            <a th:href="@{/lang(lang=es)}" class="tgo-lang-btn" title="Español">ES</a>
            <a th:href="@{/lang(lang=en)}" class="tgo-lang-btn" title="English">EN</a>
        </div>
    </div>
</nav>

<th:block th:fragment="navbarCss">
    <link rel="stylesheet" th:href="@{/css/navbar.css}" />
</th:block>

</html>
