services:
  db:
    image: mariadb:latest
    container_name: tallergo-db
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  tallergo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tallergo-app
    depends_on:
      - db
    environment:
      - DB_URL=jdbc:mariadb://db:3306/${DB_DATABASE}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_UPLOAD_PATH=${APP_UPLOAD_PATH}
    ports:
      - "${APP_PORT}:8080"
    volumes:
      - app_uploads:${APP_UPLOAD_PATH}

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tallergo-phpmyadmin
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"

volumes:
  db_data:
  app_uploads: